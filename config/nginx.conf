worker_processes 1;
pid /data/data/com.termux/files/usr/var/run/nginx.pid;
events { worker_connections 1024; }
http {
    include /data/data/com.termux/files/usr/etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server {
        listen 8080;
        server_name localhost;
        
        # 🛡️ REDIRECIONAMENTO 301 PARA URLS ANTIGAS
        rewrite ^/ofertas/.*-([0-9]+)\.html$ /produto.html?id=$1 permanent;

        # 🛡️ BLOQUEIO DE HACKERS (AWS, ENV, GIT, etc)
        location ~* /(\.|%2e)(env|aws|git|ansible|azure|DS_Store|svn|hg|bzr) {
            deny all;
            return 403;
        }

        # Serve os arquivos estáticos
        location / {
            root /data/data/com.termux/files/home/Loja-Da-Shopee/frontend;
            index recomende.html index.html;
            try_files $uri $uri/ =404;
        }
        
        # Repassa a API para o Node.js
        location /api/ {
            proxy_pass http://127.0.0.1:3001/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
